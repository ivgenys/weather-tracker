name: Continuous Delivery

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types:
      - completed
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-and-smoke-check:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook (if configured)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"
          else
            echo "Render GitHub auto-deploy is active on main; skipping manual deploy hook."
          fi

      - name: Verify live production health endpoint
        env:
          PRODUCTION_URL: https://weather-tracker-gxaw.onrender.com
        run: |
          for attempt in 1 2 3 4 5; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$PRODUCTION_URL/")
            if [ "$status" = "200" ]; then
              echo "Production service responded with HTTP 200 on attempt $attempt"
              exit 0
            fi
            sleep 10
          done
          echo "Production health verification timed out"
          exit 1
