name: CD

# Render deploys main from GitHub. After CI passes, this workflow waits until
# production reports the commit that was just tested, and fails if it never does.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  verify-production:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      PRODUCTION_URL: https://weather-tracker-gxaw.onrender.com
      EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      # Optional: set the RENDER_DEPLOY_HOOK_URL secret to deploy only from here.
      - name: Trigger a Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          else
            echo "No deploy hook configured; relying on Render's GitHub auto-deploy."
          fi

      - name: Wait for production to serve the tested commit
        run: |
          for attempt in $(seq 1 45); do
            body=$(curl -s --max-time 60 "$PRODUCTION_URL/health" || true)
            echo "attempt $attempt: $body"
            if echo "$body" | grep -q '"status":"UP"' && echo "$body" | grep -q "\"version\":\"$EXPECTED_COMMIT\""; then
              echo "Production is healthy on $EXPECTED_COMMIT"
              exit 0
            fi
            sleep 20
          done
          echo "Production did not report commit $EXPECTED_COMMIT as healthy within 15 minutes"
          exit 1
