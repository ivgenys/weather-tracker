name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: weather_tracker_test
          POSTGRES_USER: weather
          POSTGRES_PASSWORD: weather_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weather -d weather_tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      rabbitmq:
        image: rabbitmq:3.12-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The database tests run on PostgreSQL and the queue tests on RabbitMQ.
      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://weather:weather_password@localhost:5432/weather_tracker_test
          TEST_RABBIT_URL: amqp://guest:guest@localhost:5672/%2F
        run: pytest -v -rs
